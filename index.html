<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Excusify</title>
</head>
<body>
    <h1>XDDD...No te lo vas a creer !! ^_^...
        Peroooo....

    <p id="excuse">El repartidor de Amazon se cargo el descapotable durante mi siesta</p>

    </h1>
    <div style="text-align: center;">
        <button class="button" onclick="location.reload();"><strong>No te sirve esta excusa?...LOL<br>Push me!!, tengo mas ;-)</strong></button>
    </div>

    <script>
    let quien = ['Mi perro', 'Mi novia', 'El repartidor de Amazon', 'Mi hija pequeña'];
    let accion = ['se comió', 'se cargo', 'destrozó', 'hizo desaparecer'];
    let que = ['mi proyecto', 'mi iPhone nuevo', 'el descapotable', 'los tulipanes del salón' ];
    let cuando = ['antes de la clase.', 'cuando estaba comiendo.', 'durante mi siesta.', 'mientras estaba jugando a la play.'];

    let arrays = [quien, accion, que, cuando];

  function generateExcuse() {
    let excuse = '';

    for (let i = 0; i < arrays.length; i++) {
      let arrayActual = arrays[i];                // Selecciona el array actual
      let indice = Math.floor(Math.random() * 4); // Número aleatorio del 0 al 3
      let palabra = arrayActual[indice];          // Obtiene la palabra
      excuse = excuse + palabra + ' ';            // Añade la palabra a la excusa
    }

    return excuse; // Devuelve la excusa completa
  }

  // Al cargar la página, generamos una excusa automáticamente
  window.onload = function() {
    document.getElementById("excuse").innerHTML = generateExcuse();
  }
</script>
</body>
</html>
